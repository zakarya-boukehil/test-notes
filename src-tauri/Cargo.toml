[package]
name = "test-notes"
version = "1.0.0"
description = "TestNotes Windows Mini-App"
authors = ["Antigravity"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6" }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
